[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iitauquant-data"
version = "0.1.0"
description = "Camada auditavel de dados do fundo sistematico multi-sleeve"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "requests>=2.31",
  "yfinance>=0.2.54",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
tradingview = [
  "pyarrow>=17.0",
  "polars>=1.0",
  "vectorbt>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "duckdb>=1.1",
  "optuna>=4.0",
]
dev = [
  "pytest>=8.3",
]

[project.scripts]
iitauquant-data = "iitauquant_data.cli:main"
iitauquant-paper = "automation.__main__:main"
iitauquant-research = "investment_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "quant_fund" = "quant_fund"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "iitauquant_data*",
  "investment_research*",
  "automation*",
  "backtest*",
  "server*",
  "strategies*",
  "quant_fund*",
]
namespaces = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
