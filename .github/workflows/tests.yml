name: Tests and packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" "fastapi>=0.115" "httpx>=0.27" "pyarrow>=17.0" "statsmodels>=0.14" "matplotlib>=3.9"
      - name: Run Python suite without market downloads
        run: python -m pytest tests -q
      - name: Build distributable package
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir tmp/wheels .
      - name: Check wheel contents and entry point
        shell: python
        run: |
          import pathlib
          import zipfile
          wheel = next(pathlib.Path("tmp/wheels").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "quant_fund/__init__.py" in names
              assert "investment_research/cli.py" in names
              assert "iitauquant_data/cli.py" in names
              entry_points = next(n for n in names if n.endswith(".dist-info/entry_points.txt"))
              assert "iitauquant-research = investment_research.cli:main" in archive.read(entry_points).decode()
      - name: Check installed package outside the checkout
        shell: pwsh
        run: |
          $packageWheel = (Get-ChildItem tmp/wheels/*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $packageWheel
          Push-Location $env:RUNNER_TEMP
          try {
            python -c "import quant_fund, investment_research, iitauquant_data"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            iitauquant-research --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

  cloudflare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Cloudflare Worker suite
        run: node --test infra/cloudflare/test/worker.test.mjs
